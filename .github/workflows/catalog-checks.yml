name: Catalog checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: tooling
          path: .catalog-tooling
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .catalog-tooling/requirements.txt
      - run: python -m pip install --requirement .catalog-tooling/requirements.txt
      - run: python .catalog-tooling/cataloggen.py check --repo "$GITHUB_WORKSPACE"
      - name: Reject files owned by other branches
        shell: bash
        run: |
          forbidden="$({
            find . -path './.git' -prune -o -path './.catalog-tooling' -prune -o \
              \( -name '*.zip' -o -name '.DS_Store' -o -name 'frame_*.png' \
              -o -name '*.py' -o -name '*.html' -o -name '*.css' -o -name '*.mjs' \) \
              -print
          })"
          if [[ -n "$forbidden" ]]; then
            printf 'Files owned by tooling or site branches found on main:\n%s\n' "$forbidden"
            exit 1
          fi
